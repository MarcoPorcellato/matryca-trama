[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trama-logseq-og-adapter"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "trama-contracts",
    "trama-core",
    "trama-parser-bridge",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trama_logseq_og_adapter"]
